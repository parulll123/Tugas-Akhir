<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Monitor - Edge AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #121212; --sidebar-bg: #181818; --card-bg: #1e1e1e;
            --text-main: #e0e0e0; --text-muted: #a0a0a0;
            --accent-cyan: #00d2ff; --status-danger: #ff3333; --status-normal: #00ff88;
        }
        body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Roboto', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar Styling */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid #333; display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .brand { font-size: 1.2rem; font-weight: bold; color: var(--accent-cyan); margin-bottom: 40px; display: flex; gap: 10px; align-items: center; text-transform: uppercase; letter-spacing: 1px; }
        .nav-links { list-style: none; padding: 0; flex-grow: 1; }
        .nav-link { display: flex; align-items: center; gap: 15px; padding: 12px 15px; color: var(--text-muted); text-decoration: none; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { background-color: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); }
        .nav-link i { width: 20px; text-align: center; }
        
        /* User Profile Section */
        .user-profile {
            border-top: 1px solid #333;
            padding-top: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            background: #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-cyan);
            font-size: 1.2rem;
        }
        
        .user-info h4 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 600;
        }
        
        .user-info span {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .logout-btn {
            color: var(--status-danger);
            text-decoration: none;
            font-size: 1.2rem;
            margin-left: auto;
            padding: 5px;
            transition: 0.3s;
        }
        
        .logout-btn:hover {
            color: #ff6666;
        }
        
        /* Content Area */
        .main-content { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1000px; }
        
        /* Table Styling (Untuk History) */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #252525; color: var(--accent-cyan); text-transform: uppercase; font-size: 0.85rem; }
        
        /* Form Styling (Untuk Config) */
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; background: #252525; border: 1px solid #444; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-save { background: var(--accent-cyan); color: #000; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-save:hover { background: #00aacc; }
        
        /* Alert Message */
        .alert { padding: 10px; background: rgba(0, 255, 136, 0.2); color: #00ff88; border: 1px solid #00ff88; border-radius: 5px; margin-bottom: 20px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="sidebar">
        <div class="brand"><i class="fa-solid fa-microchip"></i> EDGE AI MONITOR</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}" class="nav-link {% if request.path == '/' %}active{% endif %}"><i class="fa-solid fa-chart-line"></i> Dashboard</a></li>
            <li><a href="{{ url_for('history') }}" class="nav-link {% if request.path == '/history' %}active{% endif %}"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Anomali</a></li>
            <li><a href="{{ url_for('config_page') }}" class="nav-link {% if request.path == '/settings' %}active{% endif %}"><i class="fa-solid fa-sliders"></i> Konfigurasi</a></li>
        </ul>
        
        <!-- User Profile Section -->
        <div class="user-profile">
            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="user-info">
                <h4>{{ current_user.username }}</h4>
                <span>Operator</span>
            </div>
            <a href="{{ url_for('logout') }}" class="logout-btn" title="Logout">
                <i class="fa-solid fa-right-from-bracket"></i>
            </a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
